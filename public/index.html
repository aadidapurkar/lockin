<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lockin</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="main">
            <div id="status">
                <!-- Display Lock Status to User -->
                <p id="htmlLockText">This tab in this window is</p>

                <!-- Display Tab Limit to User-->
                <p id="htmlLimitText">Current tab limit is</p>
            </div>
            <br />

            <!-- Input for Changing Lock Status -->
            <div id="lockDiv">
                <label for="">Lock Current Tab</label>
                <input type="checkbox" id="htmlLockInp" />
                <br />
            </div>

            <div id="limitDiv">
                <!-- Input for Changing Tab Limit -->
                <br />
                <input
                    type="number"
                    min="1"
                    id="htmlLimitInp"
                    placeholder="Tab Limit..."
                />
                <button id="btnSubmitTabLimit">Submit</button>
                <br />
            </div>

            <div id="banDiv">
                <div id="bd1">
                    <!-- Input for Banning New Site -->
                    <br />
                    <input
                        type="text"
                        id="htmlNewBanInp"
                        placeholder="New Ban..."
                    />
                    <button id="btnSubmitNewBan">Submit</button>
                    <br />
                </div>

                <!-- Input for Removing Banned Sites -->
                <div id="bd2">
                    <br />
                    <select id="htmlBanDropdown">
                        <option value="" disabled selected>Unban a site</option>
                    </select>
                    <button id="htmlBtnUnban">Unban</button>
                </div>
            </div>
        </div>
        <script type="module" src="main.js"></script>
    </body>
</html>
